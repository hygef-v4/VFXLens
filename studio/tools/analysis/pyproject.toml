[project]
name = "vfxlens-analysis-extras"
version = "0.1.0"
description = "Isolated local animation, music analysis and alignment tools"
requires-python = ">=3.12,<3.13"
dependencies = [
    "earshot[mcp]",
    "librosa==1.0.1",
    "manim==0.22.1",
    "torch~=2.8.0",
    "torchaudio~=2.8.0",
    "torchvision~=0.23.0",
    "whisperx==3.8.6",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
earshot = { git = "https://github.com/Leonxlnx/earshot", rev = "4ac3d2ac2b151e1c23376f9ce7f3047a17050013" }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
