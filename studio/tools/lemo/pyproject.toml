[project]
name = "vfxlens-lemo"
version = "0.1.0"
description = "Isolated core, voice and music dependencies for the Lemo film toolkit"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "soxr",
    "pillow",
    "fonttools",
    "kokoro-onnx",
    "edge-tts",
    "faster-whisper",
    "av<19",
    "numba",
]
