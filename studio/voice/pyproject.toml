[project]
name = "vfxlens-voice"
version = "0.1.0"
description = "Isolated local speech timing tools for VFXLens productions"
requires-python = ">=3.11,<3.12"
dependencies = [
    "openai-whisper>=20250625",
    "torch>=2.5.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
