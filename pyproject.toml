[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "vfx-learning-engine"
version = "0.1.0"
description = "VFX Learning Engine (Phase 1): After Effects Project Analyzer (.aep/.aepx) and High-Speed Video VFX Analyzer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "VFX Learning Engine Team" }
]
keywords = ["vfx", "after-effects", "aep", "aepx", "video-analysis", "computer-vision", "motion-graphics"]
dependencies = [
    "pydantic>=2.6.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "scenedetect>=0.6.4",
    "Pillow>=10.2.0",
    "py-aep>=0.1.0",
    "PyYAML>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
vfx = "vfx_engine.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vfx_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v -ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
